name: Build Diamond Rush APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Diamond Rush repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download J2ME Loader source
        run: |
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git j2me-loader

      - name: Download the bundled Diamond Rush JAR and side PNGs
        run: |
          mkdir -p j2me-loader/app/src/main/assets
          curl -fL --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/devilhandle/Diamond-Rush/main/diamondrus_lybcoaz8%20%281%29.jar' \
            -o j2me-loader/app/src/main/assets/diamond_rush.jar
          curl -fL --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/devilhandle/Diamond-Rush/main/20260903_214227.png' \
            -o j2me-loader/app/src/main/assets/side_left.png
          curl -fL --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/devilhandle/Diamond-Rush/main/20260903_214308.png' \
            -o j2me-loader/app/src/main/assets/side_right.png
          test -s j2me-loader/app/src/main/assets/diamond_rush.jar
          test -s j2me-loader/app/src/main/assets/side_left.png
          test -s j2me-loader/app/src/main/assets/side_right.png
          unzip -t j2me-loader/app/src/main/assets/diamond_rush.jar >/dev/null

      - name: Prepare Android signing for CI
        working-directory: j2me-loader
        run: |
          set -e
          keytool -genkeypair \
            -keystore ci-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -noprompt
          cat > keystore.properties <<EOF
          keyAlias=androiddebugkey
          keyPassword=android
          storeFile=$GITHUB_WORKSPACE/j2me-loader/ci-debug.keystore
          storePassword=android
          EOF
          test -s keystore.properties
          test -s ci-debug.keystore

      - name: Set app name
        working-directory: j2me-loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('settings.gradle')
          s = p.read_text()
          s = re.sub(r"rootProject\.name\s*=.*", "rootProject.name = 'Diamond Rush'", s, count=1)
          p.write_text(s)
          PY

      - name: Add bundled-game launcher
        working-directory: j2me-loader
        run: |
          mkdir -p app/src/main/java/ru/playsoftware/j2meloader
          cat > app/src/main/java/ru/playsoftware/j2meloader/BundledLauncher.java <<'JAVA'
          package ru.playsoftware.j2meloader;

          import android.app.Activity;
          import android.content.pm.ActivityInfo;
          import android.widget.Toast;

          import com.android.dx.command.dexer.Main;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.jar.JarFile;
          import java.util.jar.Manifest;

          import ru.playsoftware.j2meloader.config.Config;
          import ru.playsoftware.j2meloader.config.ProfileModel;
          import ru.playsoftware.j2meloader.config.ProfilesManager;

          public final class BundledLauncher {
              private static final String ASSET = "diamond_rush.jar";
              private static final String APP_DIR_NAME = "Diamond_Rush";

              private BundledLauncher() {}

              public static void launch(Activity activity) {
                  try {
                      activity.setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);

                      File appDir = new File(Config.getAppDir(), APP_DIR_NAME);
                      if (!appDir.exists() && !appDir.mkdirs()) {
                          throw new Exception("Cannot create game directory");
                      }

                      File resJar = new File(appDir, Config.MIDLET_RES_FILE);
                      File dex = new File(appDir, Config.MIDLET_DEX_FILE);
                      File manifestFile = new File(appDir, Config.MIDLET_MANIFEST_FILE);
                      File configDir = new File(Config.getConfigsDir(), APP_DIR_NAME);

                      if (!dex.isFile() || !resJar.isFile() || !manifestFile.isFile()) {
                          copyAsset(activity, ASSET, resJar);

                          Manifest manifest;
                          try (JarFile jar = new JarFile(resJar)) {
                              manifest = jar.getManifest();
                          }
                          if (manifest == null) {
                              throw new Exception("Diamond Rush JAR has no manifest");
                          }

                          try (FileOutputStream out = new FileOutputStream(manifestFile)) {
                              manifest.write(out);
                          }

                          Main.main(new String[]{
                                  "--no-optimize",
                                  "--core-library",
                                  "--output=" + dex.getAbsolutePath(),
                                  resJar.getAbsolutePath()
                          });

                          if (!dex.isFile()) {
                              throw new Exception("J2ME conversion did not create converted.dex");
                          }
                      }

                      if (!configDir.exists() && !configDir.mkdirs()) {
                          throw new Exception("Cannot create profile directory");
                      }

                      ProfileModel profile = new ProfileModel(configDir);
                      profile.screenWidth = 240;
                      profile.screenHeight = 320;
                      profile.orientation = 3;
                      profile.screenScaleType = 1;
                      profile.screenGravity = 2;
                      profile.screenScaleToFit = true;
                      profile.screenKeepAspectRatio = true;
                      profile.forceFullscreen = true;
                      profile.showKeyboard = true;
                      profile.touchInput = true;
                      if (!ProfilesManager.saveConfig(profile)) {
                          throw new Exception("Cannot save game profile");
                      }

                      String name = "Diamond Rush";
                      try (JarFile jar = new JarFile(resJar)) {
                          Manifest manifest = jar.getManifest();
                          if (manifest != null) {
                              String n = manifest.getMainAttributes().getValue("MIDlet-Name");
                              if (n != null && !n.trim().isEmpty()) name = n.trim();
                          }
                      }

                      Config.startApp(activity, name, appDir.getAbsolutePath(), false);
                      activity.finish();
                  } catch (Throwable e) {
                      e.printStackTrace();
                      Toast.makeText(activity, "Diamond Rush başlatılamadı: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private static void copyAsset(Activity activity, String assetName, File target) throws Exception {
                  try (InputStream in = activity.getAssets().open(assetName);
                       FileOutputStream out = new FileOutputStream(target)) {
                      byte[] buffer = new byte[8192];
                      int n;
                      while ((n = in.read(buffer)) != -1) {
                          out.write(buffer, 0, n);
                      }
                  }
              }
          }
          JAVA

      - name: Add side PNG controls and black background
        working-directory: j2me-loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/javax/microedition/shell/MicroActivity.java')
          s = p.read_text()

          imports = '''import android.graphics.BitmapFactory;\nimport android.graphics.Color;\nimport android.view.Gravity;\nimport android.widget.FrameLayout;\nimport android.widget.ImageView;\n'''
          marker = 'import android.content.Intent;\n'
          if 'import android.graphics.BitmapFactory;' not in s:
              if marker not in s:
                  raise SystemExit('MicroActivity import marker not found')
              s = s.replace(marker, marker + imports, 1)

          field_marker = 'private String appPath;\n'
          fields = '''private ImageView leftSideArt;\nprivate ImageView rightSideArt;\n'''
          if 'private ImageView leftSideArt;' not in s:
              if field_marker not in s:
                  raise SystemExit('MicroActivity field marker not found')
              s = s.replace(field_marker, field_marker + fields, 1)

          setup_marker = 'setContentView(view);\n'
          setup_code = '''setContentView(view);\n\nsetupSideArt();\n'''
          if 'setupSideArt();' not in s:
              if setup_marker not in s:
                  raise SystemExit('MicroActivity setContentView marker not found')
              s = s.replace(setup_marker, setup_code, 1)

          method_marker = 'public void lockNightMode() {\n'
          method = r'''private void setupSideArt() {
    View root = binding.getRoot();
    if (!(root instanceof ViewGroup)) {
        return;
    }

    root.setBackgroundColor(Color.BLACK);

    FrameLayout container = new FrameLayout(this);
    container.setBackgroundColor(Color.TRANSPARENT);
    container.setClickable(false);
    container.setFocusable(false);

    leftSideArt = new ImageView(this);
    rightSideArt = new ImageView(this);
    leftSideArt.setImageBitmap(BitmapFactory.decodeStream(getAssets().open("side_left.png")));
    rightSideArt.setImageBitmap(BitmapFactory.decodeStream(getAssets().open("side_right.png")));
    leftSideArt.setScaleType(ImageView.ScaleType.FIT_CENTER);
    rightSideArt.setScaleType(ImageView.ScaleType.FIT_CENTER);
    leftSideArt.setClickable(false);
    rightSideArt.setClickable(false);
    leftSideArt.setFocusable(false);
    rightSideArt.setFocusable(false);

    container.addView(leftSideArt, new FrameLayout.LayoutParams(1, 1));
    container.addView(rightSideArt, new FrameLayout.LayoutParams(1, 1));

    ViewGroup rootGroup = (ViewGroup) root;
    rootGroup.addView(container, new ViewGroup.LayoutParams(
            ViewGroup.LayoutParams.MATCH_PARENT,
            ViewGroup.LayoutParams.MATCH_PARENT));

    root.post(this::positionSideArt);
}

private void positionSideArt() {
    if (leftSideArt == null || rightSideArt == null || binding == null) {
        return;
    }

    View root = binding.getRoot();
    if (!(root instanceof ViewGroup)) {
        return;
    }

    int rootWidth = root.getWidth();
    int rootHeight = root.getHeight();
    if (rootWidth <= 0 || rootHeight <= 0) {
        root.post(this::positionSideArt);
        return;
    }

    View game = binding.displayableContainer.getChildCount() > 0
            ? binding.displayableContainer.getChildAt(0) : null;

    int gameWidth = game != null ? game.getWidth() : Math.min(rootHeight * 3 / 4, rootWidth);
    if (gameWidth <= 0) {
        gameWidth = Math.min(rootHeight * 3 / 4, rootWidth);
    }

    int sideWidth = Math.max(0, (rootWidth - gameWidth) / 2);
    int y = 0;

    ViewGroup.LayoutParams leftLp = leftSideArt.getLayoutParams();
    if (!(leftLp instanceof FrameLayout.LayoutParams)) {
        leftLp = new FrameLayout.LayoutParams(sideWidth, rootHeight);
    }
    FrameLayout.LayoutParams left = (FrameLayout.LayoutParams) leftLp;
    left.width = sideWidth;
    left.height = rootHeight;
    left.leftMargin = 0;
    left.topMargin = y;
    left.gravity = Gravity.START | Gravity.TOP;
    leftSideArt.setLayoutParams(left);

    ViewGroup.LayoutParams rightLp = rightSideArt.getLayoutParams();
    if (!(rightLp instanceof FrameLayout.LayoutParams)) {
        rightLp = new FrameLayout.LayoutParams(sideWidth, rootHeight);
    }
    FrameLayout.LayoutParams right = (FrameLayout.LayoutParams) rightLp;
    right.width = sideWidth;
    right.height = rootHeight;
    right.leftMargin = rootWidth - sideWidth;
    right.topMargin = y;
    right.gravity = Gravity.START | Gravity.TOP;
    rightSideArt.setLayoutParams(right);
}

'''
          if 'private void setupSideArt()' not in s:
              if method_marker not in s:
                  raise SystemExit('MicroActivity method marker not found')
              s = s.replace(method_marker, method + method_marker, 1)

          process_marker = 'if (next != null) {\n\tbinding.displayableContainer.addView(next.getDisplayableView());\n}\n'
          process_replacement = process_marker + '\npositionSideArt();\nbinding.getRoot().post(MicroActivity.this::positionSideArt);\n'
          if 'MicroActivity.this::positionSideArt' not in s:
              if process_marker not in s:
                  raise SystemExit('MicroActivity SetCurrentEvent marker not found')
              s = s.replace(process_marker, process_replacement, 1)

          p.write_text(s)
          PY

      - name: Launch embedded game
        working-directory: j2me-loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ru/playsoftware/j2meloader/MainActivity.java')
          s = p.read_text()
          needle = '\t\tsuper.onCreate(savedInstanceState);\n'
          replacement = needle + '\t\tif (savedInstanceState == null) {\n\t\t\tBundledLauncher.launch(this);\n\t\t\treturn;\n\t\t}\n'
          if replacement not in s:
              if needle not in s:
                  raise SystemExit('MainActivity onCreate marker not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)
          PY

      - name: Build APK
        working-directory: j2me-loader
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOpenDebug --stacktrace

      - name: Verify APK
        working-directory: j2me-loader
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-Rush-APK
          path: j2me-loader/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
